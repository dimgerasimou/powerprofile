# /etc/powerprofile.conf
#
# Must be owned by root and not writable by others: powerprofile refuses to
# run as root on anything else, because `run =` executes as root.
#
# Full-line comments only. A key that neither a profile nor [default] names
# leaves that setting alone, except pl1 and pl2: those restore the firmware
# default (captured once per boot). See powerprofile.conf(5).

# Backlight device under /sys/class/backlight. Set it explicitly: hybrid
# laptops often expose several. Default: the first one found.
backlight = intel_backlight

# The two profiles --auto chooses between, from the AC adapter. Both must be
# sections below. Any other section is a manual override:
# `powerprofile --profile NAME`. Defaults: bat and ac.
on_battery = battery
on_ac      = balanced

# What every profile starts from. A profile then lists only what differs, and
# everything else goes back to this when you switch: a toggle one profile
# turns on (super_battery, cooler_boost, ...) is turned off again by the next.
# Without a value here, a setting one profile changes would stay changed.
[default]
# CPU frequency policy; what exists depends on the cpufreq driver, and
# `powerprofile --status` shows which one this machine has:
#   intel_cpufreq (passive, what the kernel picks without HWP / Intel Speed
#   Shift): governor and epb.
#   intel_pstate, active mode with HWP: epp.
# Applying a key the driver does not have warns.
governor       = schedutil
epb            = normal
# epp          = balance_performance
turbo          = on
max_perf       = 100
wifi_powersave = off
# aspm: only if `cat /sys/module/pcie_aspm/parameters/policy` can be written
# (a firmware that disables ASPM makes the kernel refuse it).
# aspm           = default
# nvidia_powerd: Dynamic Boost, only where the firmware allows it; check
# `journalctl -u nvidia-powerd` for "requested to disable Dynamic Boost".
# nvidia_powerd  = off
# Embedded controller, through the msi-ec driver. What is accepted depends on
# the firmware: `msiecctl --get available_shift_modes` lists the shift modes.
# Attributes the firmware does not have are reported and skipped.
shift_mode     = comfort
fan_mode       = auto
cooler_boost   = off
super_battery  = off
# kbd_backlight = 2

# The profiles. `only = ac` / `only = bat` names a power source, not a
# profile, so it does not change with the names.

[battery]
epb            = balance-power
# epp          = power
# aspm         = powersupersave
turbo          = off
pl1            = 20
pl2            = 35
wifi_powersave = on
brightness     = 40
refresh        = 60
shift_mode     = eco
fan_mode       = silent
# kbd_backlight = 0
# run          = some-command

[balanced]
brightness     = 80
refresh        = max
# Stop charging at 80% while plugged in, for the battery's sake.
# charge_end   = 80

[gaming]
only           = ac
governor       = performance
epb            = performance
# epp          = performance
# nvidia_powerd = on
shift_mode     = turbo
fan_mode       = advanced
cooler_boost   = on

[saver]
only           = bat
epb            = power
# epp          = power
# aspm         = powersupersave
turbo          = off
max_perf       = 50
pl1            = 10
pl2            = 15
wifi_powersave = on
brightness     = 20
refresh        = 60
shift_mode     = eco
fan_mode       = silent
super_battery  = on
